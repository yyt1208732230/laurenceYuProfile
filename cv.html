<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yueteng Yu | One-page CV</title>
  <style>
    :root {
      --primary: #1c69d4;
      --ink: #262626;
      --body: #3c3c3c;
      --muted: #6b6b6b;
      --hairline: #d9d9d9;
      --surface: #f7f7f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--body);
      background: #fff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 300;
      line-height: 1.42;
      letter-spacing: 0;
    }

    main {
      width: min(960px, calc(100% - 40px));
      margin: 28px auto;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      padding-bottom: 18px;
      border-bottom: 3px solid var(--ink);
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 34px;
      line-height: 1.04;
    }

    h2 {
      margin: 22px 0 10px;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    h3 {
      margin-bottom: 4px;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.25;
    }

    a { color: var(--ink); text-decoration: none; }

    a,
    .rich-text a {
      color: var(--primary);
      font-weight: 700;
      border-bottom: 1px solid rgba(28,105,212,0.35);
    }

    .rich-text a:hover {
      border-bottom-color: var(--primary);
    }

    .rich-text strong,
    .rich-text b {
      color: var(--ink);
      font-weight: 700;
    }

    .rich-text u {
      text-decoration: underline;
      text-decoration-color: var(--primary);
      text-decoration-thickness: 1.5px;
      text-underline-offset: 2px;
    }

    .rich-text code {
      padding: 1px 4px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      color: var(--ink);
      font-size: 0.92em;
    }

    .rich-text h3 {
      margin-top: 8px;
      margin-bottom: 5px;
      font-size: 12px;
    }

    .rich-text ul,
    .rich-text ol {
      margin: 5px 0 0;
      padding-left: 16px;
    }

    .rich-text li {
      margin-bottom: 4px;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 0;
      padding: 12px 20px;
      color: #fff;
      background: var(--primary);
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
    }

    .contact {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 28px;
    }

    .item {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 14px;
      padding: 9px 0;
      border-bottom: 1px solid var(--hairline);
    }

    .period {
      color: var(--primary);
      font-weight: 700;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .tag {
      padding: 4px 7px;
      border: 1px solid var(--hairline);
      color: var(--ink);
      background: var(--surface);
      font-size: 10px;
    }

    .note {
      margin-top: 18px;
      padding: 12px;
      background: var(--surface);
      color: var(--muted);
    }

    @media print {
      @page { size: A4; margin: 12mm; }
      body { font-size: 10.2px; }
      main { width: 100%; margin: 0; }
      button { display: none; }
      h1 { font-size: 27px; }
      h2 { font-size: 13px; margin-top: 14px; }
      .item { padding: 6px 0; }
      .note { display: none; }
    }

    @media (max-width: 760px) {
      header,
      .grid,
      .item {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1 data-field="name">Yueteng (Laurence) Yu</h1>
        <p data-field="title"></p>
        <div class="contact" data-field="contact"></div>
      </div>
      <button type="button" onclick="window.print()">Save as PDF</button>
    </header>

    <section>
      <h2>Profile</h2>
      <p data-field="statement"></p>
      <p data-field="summary"></p>
    </section>

    <div class="grid">
      <section>
        <h2>Experience</h2>
        <div data-field="experience"></div>

        <h2>Selected Research Outputs</h2>
        <div data-field="publications"></div>
      </section>

      <aside>
        <h2>Education</h2>
        <div data-field="education"></div>

        <h2>Awards</h2>
        <div data-field="awards"></div>

        <h2>Research Focus</h2>
        <div class="tags" data-field="focus"></div>

        <h2>Selected Skills</h2>
        <div class="tags" data-field="skills"></div>

        <h2>Certifications</h2>
        <div class="tags" data-field="certifications"></div>
      </aside>
    </div>

    <p class="note">This one-page CV is on testing stage.</p>
  </main>

  <script>
    const field = (name) => document.querySelector(`[data-field="${name}"]`);
    const esc = (value = "") => String(value).replace(/[&<>"']/g, (char) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char]));
    const showInCV = (entry) => !entry || typeof entry !== "object" || entry.showInCV !== false;
    const itemLabel = (entry) => typeof entry === "string" ? entry : (entry.name || entry.label || entry.title || "");

    function safeHtml(value = "") {
      const template = document.createElement("template");
      template.innerHTML = String(value);
      const allowed = new Set(["A", "BR", "EM", "I", "STRONG", "B", "U", "SMALL", "SUP", "SUB", "CODE", "SPAN", "SECTION", "P", "UL", "OL", "LI", "H3"]);
      const walker = document.createTreeWalker(template.content, NodeFilter.SHOW_ELEMENT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach((node) => {
        if (!allowed.has(node.tagName)) {
          node.replaceWith(...node.childNodes);
          return;
        }
        [...node.attributes].forEach((attr) => {
          const name = attr.name.toLowerCase();
          if (name.startsWith("on") || name === "style") node.removeAttribute(attr.name);
          if (node.tagName !== "A" && name !== "class") node.removeAttribute(attr.name);
        });
        if (node.tagName === "A") {
          [...node.attributes].forEach((attr) => {
            if (!["href", "title", "target", "rel", "class"].includes(attr.name.toLowerCase())) {
              node.removeAttribute(attr.name);
            }
          });
          const href = node.getAttribute("href") || "";
          if (/^\s*javascript:/i.test(href)) node.removeAttribute("href");
          if (node.getAttribute("target") === "_blank") node.setAttribute("rel", "noopener");
        }
      });
      return template.innerHTML;
    }

    const item = (period, title, subtitle, description) => `
      <article class="item">
        <div class="period">${esc(period)}</div>
        <div class="rich-text">
          <h3>${esc(title)}</h3>
          <p><strong>${esc(subtitle)}</strong></p>
          ${description ? `<div>${safeHtml(description)}</div>` : ""}
        </div>
      </article>
    `;

    fetch("content.json", { cache: "no-store" })
      .then((response) => response.json())
      .then((data) => {
        field("name").textContent = data.profile.name;
        field("title").textContent = data.profile.title;
        field("statement").innerHTML = safeHtml(data.profile.statement);
        field("statement").classList.add("rich-text");
        field("summary").innerHTML = safeHtml(data.profile.summary[0]);
        field("summary").classList.add("rich-text");
        field("contact").innerHTML = data.profile.links.slice(0, 4).map((link) => `<a href="${esc(link.url)}">${esc(link.label)}</a>`).join("");
        field("experience").innerHTML = data.experience.filter(showInCV).map((entry) => item(entry.period, entry.role, entry.organisation, entry.description)).join("");
        field("education").innerHTML = data.education.filter(showInCV).map((entry) => item(entry.period, entry.degree, entry.institution, entry.details)).join("");
        field("awards").innerHTML = data.awards.filter(showInCV).map((entry) => item(entry.year, entry.name, entry.organisation, entry.source)).join("");
        field("publications").innerHTML = data.publications.filter(showInCV).slice(0, 4).map((entry) => item(entry.year, entry.title, entry.venue, entry.summary)).join("");
        field("focus").innerHTML = data.researchFocus.map((focus) => `<span class="tag">${esc(focus)}</span>`).join("");
        field("skills").innerHTML = data.skills.filter(showInCV).slice(0, 16).map((skill) => `<span class="tag">${esc(itemLabel(skill))}</span>`).join("");
        field("certifications").innerHTML = data.certifications.filter(showInCV).map((cert) => `<span class="tag">${esc(itemLabel(cert))}</span>`).join("");
      });
  </script>
</body>
</html>
